name: Weekly Instagram Competitor Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_DATA_PROVIDER: mock
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate report with mock data
        run: python examples/06_generate_weekly_report.py --mock
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-instagram-competitor-report
          path: reports/
